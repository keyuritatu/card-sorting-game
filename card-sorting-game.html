<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Services Card Sorting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .cards-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .cards-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cards-section h2::before {
            content: "📇";
        }

        #cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
        }

        .card.dragging {
            opacity: 0.7;
            cursor: grabbing;
        }

        .groups-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .groups-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .groups-section h2::before {
            content: "📦";
        }

        .add-group-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-group-form input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .add-group-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-group-form button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .add-group-form button:hover {
            transform: translateY(-2px);
        }

        #groups-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
        }

        .group {
            background: #f8f9fa;
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            min-height: 120px;
            transition: all 0.3s ease;
        }

        .group:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .group.drag-over {
            background: #e8ecff;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .group-name {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .group-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .group-delete:hover {
            background: #ff5252;
        }

        .group-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 30px;
        }

        .group-card {
            background: white;
            color: #333;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: grab;
        }

        .group-card:hover {
            background: #f5f5f5;
        }

        .remove-card {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            margin-left: 2px;
        }

        .remove-card:hover {
            color: #ff6b6b;
        }

        .actions {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .btn-success:hover {
            background: #40c057;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ffa94d;
            color: white;
        }

        .btn-warning:hover {
            background: #ff922b;
        }

        .results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .results-modal.show {
            display: flex;
        }

        .results-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .results-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .results-list {
            margin-bottom: 20px;
        }

        .result-group {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .result-group-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .result-items {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .copy-button {
            background: #667eea;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
        }

        .copy-button:hover {
            background: #5568d3;
        }

        .close-modal {
            background: #f0f0f0;
            color: #333;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }

            #groups-container {
                max-height: none;
            }
        }

        .empty-message {
            color: #999;
            font-size: 14px;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ City Services Organization Game</h1>
            <p>Drag the blue cards into groups that make sense to you. Create as many groups as you'd like and name them however you want!</p>
        </div>

        <div class="content">
            <div class="cards-section">
                <h2>Available Services</h2>
                <div id="cards-container"></div>
            </div>

            <div class="groups-section">
                <h2>Your Groups</h2>
                <div class="add-group-form">
                    <input
                        type="text"
                        id="group-name-input"
                        placeholder="Enter group name (e.g., 'Payments', 'Services', 'Support')"
                    >
                    <button onclick="addGroup()">+ Add Group</button>
                </div>
                <div id="groups-container"></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-success" onclick="showResults()">✓ Submit & View Results</button>
            <button class="btn btn-warning" onclick="resetAll()">↻ Start Over</button>
            <button class="btn btn-secondary" onclick="downloadJSON()">⬇ Download as JSON</button>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="results-modal" class="results-modal">
        <div class="results-content">
            <h2>Your Card Sorting Results</h2>
            <div class="results-list" id="results-list"></div>
            <div>
                <button class="copy-button" onclick="copyToClipboard()">📋 Copy Results</button>
                <button class="close-modal" onclick="closeResults()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Sample services from the IA
        const services = [
            'Pay a Utility Bill',
            'Pay Property Taxes',
            'Apply for a Permit',
            'Renew a License',
            'Check Permit Status',
            'Report a Pothole',
            'Find Tax Statement',
            'View Payment History',
            'View City News',
            'Community Feedback',
            'City Events',
            'Public Records',
            'Budget & Finance',
            'Contact Support',
            'Report an Issue',
            'FAQs',
            'Accessibility Info'
        ];

        let groups = [];
        let draggedCard = null;
        let draggedFrom = null;

        // Initialize
        function init() {
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            services.forEach((service, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = service;
                card.draggable = true;
                card.dataset.service = service;
                card.dataset.index = index;

                card.addEventListener('dragstart', (e) => {
                    draggedCard = service;
                    draggedFrom = 'cards';
                    card.classList.add('dragging');
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                });

                container.appendChild(card);
            });
        }

        function addGroup() {
            const input = document.getElementById('group-name-input');
            const name = input.value.trim();

            if (!name) {
                alert('Please enter a group name');
                return;
            }

            const newGroup = {
                id: Date.now(),
                name: name,
                cards: []
            };

            groups.push(newGroup);
            input.value = '';
            renderGroups();
        }

        function renderGroups() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            if (groups.length === 0) {
                container.innerHTML = '<div class="empty-message">Create your first group to get started</div>';
                return;
            }

            groups.forEach((group) => {
                const groupEl = document.createElement('div');
                groupEl.className = 'group';
                groupEl.draggable = false;

                const header = document.createElement('div');
                header.className = 'group-header';

                const nameEl = document.createElement('div');
                nameEl.className = 'group-name';
                nameEl.textContent = group.name;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'group-delete';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = () => deleteGroup(group.id);

                header.appendChild(nameEl);
                header.appendChild(deleteBtn);

                const cardsContainer = document.createElement('div');
                cardsContainer.className = 'group-cards';
                cardsContainer.id = `group-${group.id}`;

                cardsContainer.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    groupEl.classList.add('drag-over');
                });

                cardsContainer.addEventListener('dragleave', () => {
                    groupEl.classList.remove('drag-over');
                });

                cardsContainer.addEventListener('drop', (e) => {
                    e.preventDefault();
                    groupEl.classList.remove('drag-over');

                    // Remove from previous group/location
                    if (draggedFrom === 'group') {
                        groups.forEach(g => {
                            g.cards = g.cards.filter(c => c !== draggedCard);
                        });
                    }

                    // Add to this group
                    if (!group.cards.includes(draggedCard)) {
                        group.cards.push(draggedCard);
                    }

                    renderCards();
                    renderGroups();
                });

                // Render cards in group
                group.cards.forEach((card) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'group-card';
                    cardEl.draggable = true;
                    cardEl.textContent = card;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-card';
                    removeBtn.textContent = '×';
                    removeBtn.onclick = () => {
                        group.cards = group.cards.filter(c => c !== card);
                        renderGroups();
                        renderCards();
                    };

                    cardEl.appendChild(removeBtn);

                    cardEl.addEventListener('dragstart', (e) => {
                        draggedCard = card;
                        draggedFrom = 'group';
                    });

                    cardsContainer.appendChild(cardEl);
                });

                groupEl.appendChild(header);
                groupEl.appendChild(cardsContainer);
                container.appendChild(groupEl);
            });
        }

        function deleteGroup(id) {
            // Move cards back to available
            const group = groups.find(g => g.id === id);
            // Cards just disappear from the game (user can re-add)
            groups = groups.filter(g => g.id !== id);
            renderGroups();
            renderCards();
        }

        function resetAll() {
            if (confirm('Are you sure you want to start over?')) {
                groups = [];
                document.getElementById('group-name-input').value = '';
                renderGroups();
                renderCards();
            }
        }

        function showResults() {
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            groups.forEach((group) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'result-group';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'result-group-name';
                nameDiv.textContent = `${group.name} (${group.cards.length} items)`;

                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'result-items';
                itemsDiv.textContent = group.cards.length > 0
                    ? group.cards.join(', ')
                    : '(empty)';

                groupDiv.appendChild(nameDiv);
                groupDiv.appendChild(itemsDiv);
                resultsList.appendChild(groupDiv);
            });

            document.getElementById('results-modal').classList.add('show');
        }

        function closeResults() {
            document.getElementById('results-modal').classList.remove('show');
        }

        function copyToClipboard() {
            const data = generateResults();
            navigator.clipboard.writeText(data).then(() => {
                alert('Results copied to clipboard!');
            });
        }

        function generateResults() {
            let text = `Card Sorting Results - ${new Date().toLocaleString()}\n\n`;

            groups.forEach((group) => {
                text += `${group.name}:\n`;
                group.cards.forEach((card) => {
                    text += `  • ${card}\n`;
                });
                text += '\n';
            });

            return text;
        }

        function downloadJSON() {
            const data = {
                timestamp: new Date().toISOString(),
                groups: groups,
                uncategorized: services.filter(s =>
                    !groups.some(g => g.cards.includes(s))
                )
            };

            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `card-sort-results-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
